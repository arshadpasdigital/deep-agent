services:
  api-gateway:
    image: deep-agent-api-gateway:local
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "${API_GATEWAY_PORT:-8080}:3000"
    environment:
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
      DEEPAGENT_SERVICE_URL: http://deepagent-service:3000
    env_file:
      - path: .env
        required: false
    depends_on:
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      deepagent-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

