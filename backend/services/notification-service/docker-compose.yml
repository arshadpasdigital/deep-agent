services:

  notification-service:
    image: deep-agent-notification-service:local
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      PORT: "3000"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge


