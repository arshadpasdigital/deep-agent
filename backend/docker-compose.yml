services:
  api-gateway:
    image: deep-agent-api-gateway:local
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "${API_GATEWAY_PORT:-8080}:3000"
    environment:
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
      DEEPAGENT_SERVICE_URL: http://deepagent-service:3000
    env_file:
      - path: ./services/api-gateway/.env
        required: false
    depends_on:
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      deepagent-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  auth-service:
    image: deep-agent-auth-service:local
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PORT: "3000"
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-deepagent}:${MONGO_INITDB_ROOT_PASSWORD:-local-development-only}@mongodb:27017/deep_agent?authSource=admin
    env_file:
      - path: ./services/auth-service/.env
        required: false
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  notification-service:
    image: deep-agent-notification-service:local
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      PORT: "3000"
    env_file:
      - path: ./services/notification-service/.env
        required: false
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  deepagent-service:
    image: deep-agent-deepagent-service:local
    build:
      context: .
      dockerfile: services/deepagent-service/Dockerfile
    environment:
      PORT: "3000"
    env_file:
      - path: ./services/deepagent-service/.env
        required: false
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-deepagent}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-local-development-only}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  mongodb-data:
